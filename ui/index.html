<!doctype html><html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'"><title>Morphlet</title><link rel="stylesheet" href="style.css"></head><body><main id="popup"><header><span class="brand">Morphlet</span><span>⌥ C</span><button id="close" aria-label="Dismiss">×</button></header><section id="menu"><div id="wheel"><svg id="sectors" viewBox="0 0 400 400" aria-label="Conversion formats"></svg><div id="center"><span id="file-icon">↗</span><strong id="filename">Select a file</strong><small id="file-count">in Finder</small></div></div><p id="message" role="status">Select in Finder. Press Option+C.</p><div class="menu-actions"><button id="edit" hidden>Crop & edit</button><button id="pick">Choose files…</button></div></section><section id="editor" hidden><div class="editor-heading"><h2>Crop & edit</h2><button id="reset-edit">Reset</button></div><canvas id="crop-canvas" width="760" height="300" aria-label="Drag to select an image crop"></canvas><div class="editor-row"><label>Aspect<select id="aspect"><option value="0">Free</option><option value="1">1:1</option><option value="1.7777777778">16:9</option><option value="0.5625">9:16</option><option value="1.3333333333">4:3</option></select></label><label>Resize width<input id="resize" type="number" min="1" max="16000" placeholder="Original"></label></div><div class="crop-fields"><label>X<input id="crop-x" type="number" min="0"></label><label>Y<input id="crop-y" type="number" min="0"></label><label>Width<input id="crop-w" type="number" min="1"></label><label>Height<input id="crop-h" type="number" min="1"></label></div><div class="editor-row"><label class="quality-label">Quality <output id="quality-value">85%</output><input id="quality" type="range" min="1" max="100" value="85"></label><label class="check"><input id="flip" type="checkbox"> Flip ↕</label><label class="check"><input id="flop" type="checkbox"> Mirror ↔</label></div><p id="edit-status" role="status">Drag across the image to crop. Coordinates are pixels.</p><div class="actions"><button id="cancel-edit">Cancel</button><button id="apply-edit">Apply edits</button></div></section><section id="result" hidden><h2>Converted. Ready to go.</h2><select id="outputs" aria-label="Converted files"></select><div id="preview"></div><div class="actions"><button id="quicklook">Quick Look</button><button id="reveal">Show in Finder ↗</button></div><button id="back">← Formats</button></section><footer>On your device. Originals untouched.</footer></main><script src="app.js"></script><script src="editor.js"></script></body></html>
