name: Build Morphlet

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-15
            platform: mac
            arch: arm64
          - name: macOS Intel
            runner: macos-15-intel
            platform: mac
            arch: x64
          - name: Windows x64
            runner: windows-latest
            platform: win
            arch: x64
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          cache: npm
      - name: Verify version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node -e "const tag=process.env.GITHUB_REF_NAME; const version=require('./package.json').version; if(tag!=='v'+version)throw Error('Tag '+tag+' must match package.json version v'+version)"
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev xvfb xauth
      - name: Install dependencies
        run: npm ci
      - name: Build required native bridge
        if: runner.os != 'Windows'
        run: |
          NODE_VERSION="$(node -p 'process.versions.node')"
          HEADER_DIR="$RUNNER_TEMP/morphlet-node-headers"
          mkdir -p "$HEADER_DIR"
          curl --fail --location --retry 3 "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-headers.tar.gz" -o "$RUNNER_TEMP/node-headers.tar.gz"
          tar -xzf "$RUNNER_TEMP/node-headers.tar.gz" -C "$HEADER_DIR" --strip-components=1
          npm_config_nodedir="$HEADER_DIR" node native/build.cjs --required
      - name: Verify Linux drag bridge
        if: runner.os == 'Linux'
        run: xvfb-run -a node -e "const state=require('./native/drag-x11.node').poll(); if(!state.supported)throw Error('X11 bridge unavailable'); console.log('X11 pointer bridge ready')"
      - name: Verify Windows drag monitor
        if: runner.os == 'Windows'
        shell: powershell
        run: ./native/drag-windows.ps1 -SelfTest
      - name: Test
        run: npm test
      - name: Build installers
        run: npm run dist -- --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - name: Collect installers and checksums
        run: node scripts/collect-artifacts.cjs
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: Morphlet-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Morphlet-*
          path: release-artifacts
      - name: Upload and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            NOTES_FILE="docs/releases/${RELEASE_TAG}.md"
            if [ -f "$NOTES_FILE" ]; then
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "Morphlet $RELEASE_TAG" --notes-file "$NOTES_FILE"
            else
              gh release create "$RELEASE_TAG" --verify-tag --draft --title "Morphlet $RELEASE_TAG" --generate-notes
            fi
          fi
          find release-artifacts -type f -print0 | xargs -0 gh release upload "$RELEASE_TAG" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
